# The mechanical half of the rules: what a linter can decide is decided here, so
# check.sh, CI and the loop enforce it without anyone reading prose.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - dupl
    - errorlint
    - forbidigo
    - gochecknoinits
    - goconst
    - goheader
    - gosec
    - interfacebloat
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - usetesting
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    goheader:
      values:
        regexp:
          year: 20\d\d
      template: |-
        SPDX-FileCopyrightText: {{ year }} Pascal Fairchild
        SPDX-License-Identifier: AGPL-3.0-only
    depguard:
      rules:
        # A new module is a new line here, in the same PR as its written cost-benefit.
        dependencies:
          list-mode: strict
          allow:
            - $gostd
            # The engine's own module, every package under it, and no other module whose path only
            # begins the same way: the units' arrows are judged by their own rules. Its root holds
            # no package, so it has no line.
            - github.com/heliosestate/heliosadvance/
            # The SSH unit's handshake and channel, and only that package of the module: complete
            # and kept by the Go team, and watched by govulncheck and Dependabot here, where writing
            # our own would put thousands of lines of cryptographic protocol at the trust boundary.
            - golang.org/x/crypto/ssh$
            # The Telnet unit's Windows urgent write, and only that package of the module: the
            # standard library cannot wait for room on a Windows socket, and its syscall package
            # lacks the event and overlapped calls Winsock documents for a send with a time limit.
            # Kept by the Go team, already in go.sum through the SSH library, and watched by
            # govulncheck, Dependabot and the licence gate; the alternative, a non-blocking switch
            # on Go's overlapped socket and a 10 ms retry, rests on behaviour Microsoft does not
            # document (developer, 2026-10-27). Also the test support's Windows files, which list
            # and end a dead test run's programs, calls the syscall package lacks (2026-10-30).
            - golang.org/x/sys/windows$
            # The database unit's connection, sign-in and queries, and only these three packages of
            # the module: the standard library has no PostgreSQL driver, and our own would put
            # PostgreSQL's wire protocol, SCRAM and TLS at a trust boundary. MIT; it refuses every
            # way of signing in but the one named and requires channel binding, which lib/pq does
            # not; watched by govulncheck, Dependabot and the licence gate (database Part 1).
            # pgproto3 for one type, the error a reply longer than the bound gives (2026-10-29).
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/pgconn$
            - github.com/jackc/pgx/v5/pgproto3$
          deny:
            - pkg: math/rand
              desc: use crypto/rand
            # Secure by default: the language's escape hatches are refused everywhere. A file
            # that truly needs one is an exception below, named, with its reason, by the
            # developer's pull request.
            - pkg: unsafe
              desc: unsafe switches off Go's memory safety; an exception is the developer's decision, by name
            - pkg: C
              desc: cgo brings C's memory safety into the engine; an exception is the developer's decision, by name
        # A package no unit rule below covers may import the standard library alone, so a new unit
        # cannot reach another before its own rule, and its row in docs/architecture.md, exist.
        # A new unit's rule is a new line in this list too.
        unruled:
          files:
            - $all
            - "!**/internal/telnet/**"
            - "!**/internal/session/**"
            - "!**/internal/textio/**"
            - "!**/internal/timeup/**"
            - "!**/internal/ssh/**"
            - "!**/internal/listener/**"
            - "!**/internal/database/**"
            - "!**/cmd/hadv-service/**"
            - "!**/tools/**"
            - "!**/internal/testrun/*_windows.go"
          list-mode: strict
          allow:
            - $gostd
        # One rule per unit: its allowed imports are the Uses column of docs/architecture.md.
        # A new arrow is a new line here, in the same PR, with its reason. Each of the engine's
        # own packages is named exactly, ending in $, so a later package whose path only begins
        # the same way, or a unit's own sub-package, is a new arrow and needs its own line. check.sh
        # refuses an engine path in an allow list that does not end in $, but the dependencies
        # rule's one module-wide entry: it catches a slip or a merge, not a disguise, which review
        # of this file catches. Outside modules' entries end in $ too, by hand: no check reads them.
        telnet:
          files: ["**/internal/telnet/**", "!**/internal/telnet/urgent_windows.go"]
          list-mode: strict
          allow:
            - $gostd
            # The rule for a call's end and the wake, written once (docs/architecture.md).
            - github.com/heliosestate/heliosadvance/internal/timeup$
            # Its own path, so its black-box tests in package telnet_test can import it.
            - github.com/heliosestate/heliosadvance/internal/telnet$
            # The test support, for its tests alone (check.sh's gate 4i).
            - github.com/heliosestate/heliosadvance/internal/testrun$
        # The Telnet unit's Windows urgent write, the one file that may import the module's
        # windows package (docs/architecture.md, the developer's of 2026-10-27).
        telnet-windows-urgent:
          files: ["**/internal/telnet/urgent_windows.go"]
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sys/windows$
        # The tools under tools/ import the standard library only, so the module-wide allow list,
        # which names golang.org/x/sys/windows for the Telnet unit's one file and the test
        # support's Windows files, reaches no tool
        # (developer, 2026-10-27).
        tools:
          files: ["**/tools/**"]
          list-mode: strict
          allow:
            - $gostd
        session:
          files: ["**/internal/session/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own path, so its black-box tests in package session_test can import it.
            - github.com/heliosestate/heliosadvance/internal/session$
        textio:
          files: ["**/internal/textio/**"]
          list-mode: strict
          allow:
            - $gostd
            # The rule for a call's end, written once (docs/architecture.md).
            - github.com/heliosestate/heliosadvance/internal/timeup$
            # Its own path, so its black-box tests in package textio_test can import it.
            - github.com/heliosestate/heliosadvance/internal/textio$
        timeup:
          files: ["**/internal/timeup/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own path, so its black-box tests in package timeup_test can import it.
            - github.com/heliosestate/heliosadvance/internal/timeup$
        ssh:
          files: ["**/internal/ssh/**"]
          list-mode: strict
          allow:
            - $gostd
            # The handshake and the channel are the library's (docs/architecture.md); its other
            # packages, such as ssh/agent, are not allowed.
            - golang.org/x/crypto/ssh$
            # The rule for a call's end and the wake, written once (docs/architecture.md).
            - github.com/heliosestate/heliosadvance/internal/timeup$
            # Its own path, so its black-box tests in package ssh_test can import it.
            - github.com/heliosestate/heliosadvance/internal/ssh$
            # The test support, for its tests alone (check.sh's gate 4i).
            - github.com/heliosestate/heliosadvance/internal/testrun$
        listener:
          files: ["**/internal/listener/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            # It hands every kind's call to the Session through Text I/O, and names no kind of
            # connection (docs/architecture.md, Part 3's shape).
            - github.com/heliosestate/heliosadvance/internal/textio$
            - github.com/heliosestate/heliosadvance/internal/session$
        # The Listener's tests drive it with a real kind of connection, Telnet's, never a fake;
        # its approved rows for the Session and Text I/O run over a real Telnet Line. Its code
        # still names no kind (developer, 2026-10-25).
        listener-tests:
          files: ["**/internal/listener/**_test.go"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/textio$
            - github.com/heliosestate/heliosadvance/internal/session$
            - github.com/heliosestate/heliosadvance/internal/telnet$
            # Its own path, so its black-box tests in package listener_test can import it.
            - github.com/heliosestate/heliosadvance/internal/listener$
            # The test support, for its tests alone (check.sh's gate 4i).
            - github.com/heliosestate/heliosadvance/internal/testrun$
        database:
          files: ["**/internal/database/**"]
          list-mode: strict
          allow:
            - $gostd
            # The connection, sign-in and queries are the library's (docs/architecture.md); its
            # other packages, such as pgxpool, are not allowed.
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/pgconn$
            # For the one type pgx gives a message longer than the reply bound,
            # ExceededMaxBodyLenErr, so a too-long reply reads as a failed connection by its type,
            # not by text an update of pgx could change (the developer's "yes", 2026-10-29).
            - github.com/jackc/pgx/v5/pgproto3$
            # Its own path, so its black-box tests in package database_test can import it.
            - github.com/heliosestate/heliosadvance/internal/database$
            # The test support, for its tests alone (check.sh's gate 4i).
            - github.com/heliosestate/heliosadvance/internal/testrun$
        hadv-service:
          files: ["**/cmd/hadv-service/**"]
          list-mode: strict
          allow:
            - $gostd
            # It starts and stops the Listener, and pairs each kind's sockets with its way in
            # (docs/architecture.md, Part 3's shape); Text I/O and the Session are the Listener's.
            - github.com/heliosestate/heliosadvance/internal/listener$
            - github.com/heliosestate/heliosadvance/internal/telnet$
            - github.com/heliosestate/heliosadvance/internal/ssh$
            # It reads the connection file and takes the lease before it listens, and closes the
            # listeners when the lease is lost (database Part 1).
            - github.com/heliosestate/heliosadvance/internal/database$
            # The test support, for its tests alone (check.sh's gate 4i).
            - github.com/heliosestate/heliosadvance/internal/testrun$
        # The test support's Windows files, which find and end a dead run's programs (the
        # developer, 2026-10-30); its other files are the catch-all rule's, the standard library.
        testrun-windows:
          files: ["**/internal/testrun/*_windows.go"]
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sys/windows$
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use log/slog
        # The print rule alone let a line reach the console past slog, through fmt.Fprintln or
        # os.Stderr.WriteString (2026-10-22). Writing to a connection, file or buffer stays allowed.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: the local log goes through log/slog; a package that needs the console is a named exception below
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: use log/slog, structured
        - pattern: ^io\.ReadAll$
          msg: read into a fixed-size buffer with io.ReadFull; no read drains a reader, bounded or not
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: settings come from the settings store and secrets from the shared secrets subsystem, never the environment
        - pattern: ^time\.Sleep$
          msg: tests synchronise on events or the fake clock, never on a sleep
        # A DLL is loaded only from System32 (NewLazySystemDLL), never by the search order,
        # where a planted DLL of the same name would run in the engine. Everywhere.
        - pattern: ^(windows|syscall)\.(NewLazyDLL|LoadDLL|MustLoadDLL|LoadLibrary|LoadLibraryEx)$
          pkg: ^(syscall|golang\.org/x/sys/windows)$
          msg: load a DLL only from System32, with NewLazySystemDLL
    gosec:
      excludes:
        - G104 # errcheck already reports an unchecked error
      config:
        global:
          # gosec's own "#nosec" comment silences a finding without the word nolint, past every
          # check on nolint; with this set, gosec ignores it and reports the finding anyway.
          nosec: true
    # A copied block of 100 tokens or more fails: shared code is a helper, not a second copy.
    # Stricter than the linter's default of 150.
    dupl:
      threshold: 100
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: receiver-naming
        - name: var-naming
        - name: exported
        - name: unused-parameter
  exclusions:
    # A file that says it was generated is linted like any other: none of the engine's is, and
    # the default would skip every linter, the import rules included, for one comment line.
    generated: disable
    rules:
      # A contract.go is a unit's whole surface, declared at the owner and locked; the
      # small-interface rule applies to consumers, which declare the slice they call.
      - path: contract\.go
        linters: [interfacebloat]
      # A tool under tools/ is a command whose output is its findings and which runs go
      # itself; the print and subprocess rules are for the engine.
      - path: tools/
        linters: [forbidigo, gosec]
        text: fmt\.Print|os\.Std(out|err)|G204|G703
      # The program hands its standard error to the slog logger it writes the local log through.
      - path: cmd/hadv-service/main\.go
        linters: [forbidigo]
        text: os\.Stderr
      # A test's child process reports to the test through its standard output; the console
      # rule is for the engine's log.
      - path: _test\.go
        linters: [forbidigo]
        text: os\.Std(out|err)
      # Copied code is judged in production code only: approved tests are locked, so a finding
      # there is one no session could fix.
      - path: _test\.go
        linters: [dupl]
      # The sleep ban is for tests, the test support's code included; production code may sleep
      # on a context.
      - path-except: _test\.go|internal/testrun/
        linters: [forbidigo]
        text: time\.Sleep
      - path: _test\.go
        linters: [forbidigo]
        text: io\.ReadAll
      # A test may drop an error on purpose, written as a blank assignment so the drop is
      # visible; the check-blank rule is for production code.
      - path: _test\.go
        linters: [errcheck]
        source: '(^\s*|[{;] )(_|_, _) = '
      # A test launches the oracle and reads the files it made; gosec's subprocess and
      # path warnings are the test doing its job.
      - path: _test\.go
        linters: [gosec]
        text: G(204|304|703)
      # The test support stops a dead run's servers and reads its owner and process files.
      - path: internal/testrun/
        linters: [gosec]
        text: G(204|304)

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    # As for the linters: a file that says it was generated is formatted like any other.
    generated: disable
