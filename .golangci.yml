# The mechanical half of the rules: what a linter can decide is decided here, so
# check.sh, CI and the loop enforce it without anyone reading prose.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - forbidigo
    - gochecknoinits
    - goconst
    - goheader
    - gosec
    - interfacebloat
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - usetesting
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    goheader:
      values:
        regexp:
          year: 20\d\d
      template: |-
        SPDX-FileCopyrightText: {{ year }} Pascal Fairchild
        SPDX-License-Identifier: AGPL-3.0-only
    depguard:
      rules:
        # A new module is a new line here, in the same PR as its written cost-benefit.
        dependencies:
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance
            # The Go team's own system-call module, the one the standard library vendors: the
            # access lists, owners and handles the bootstrap unit judges and sets, and the CNG
            # key store through DLLs loaded only from System32. Cost-benefit in its PR.
            - golang.org/x/sys
          deny:
            - pkg: math/rand
              desc: use crypto/rand
            # Secure by default: the language's escape hatches are refused everywhere. A file
            # that truly needs one is an exception below, named, with its reason, by the
            # developer's pull request.
            - pkg: unsafe
              desc: unsafe switches off Go's memory safety; an exception is the developer's decision, by name
            - pkg: C
              desc: cgo brings C's memory safety into the engine; an exception is the developer's decision, by name
        # One rule per unit: its allowed imports are the Uses column of docs/architecture.md.
        # A new arrow is a new line here, in the same PR, with its reason.
        board:
          files: ["**/internal/board/**"]
          list-mode: strict
          allow:
            - $gostd
        database:
          files: ["**/internal/database/**"]
          list-mode: strict
          allow:
            - $gostd
        audit:
          files: ["**/internal/audit/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/board
            - github.com/heliosestate/heliosadvance/internal/database
        registry:
          files: ["**/internal/registry/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/audit
            - github.com/heliosestate/heliosadvance/internal/board
        lease:
          files: ["**/internal/lease/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/board
        nodes:
          files: ["**/internal/nodes/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/board
        settings:
          files: ["**/internal/settings/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/audit
            - github.com/heliosestate/heliosadvance/internal/board
        session:
          files: ["**/internal/session/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/audit
            - github.com/heliosestate/heliosadvance/internal/board
            - github.com/heliosestate/heliosadvance/internal/nodes
        rbac:
          files: ["**/internal/rbac/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/audit
            - github.com/heliosestate/heliosadvance/internal/board
        bootstrap:
          files: ["**/internal/bootstrap/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/board
            - golang.org/x/sys
        transfer:
          files: ["**/internal/transfer/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/heliosestate/heliosadvance/internal/transfer
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use log/slog
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: use log/slog, structured
        - pattern: ^io\.ReadAll$
          msg: bound the read (io.LimitReader) before draining it
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: settings come from the settings store and secrets from the shared secrets subsystem, never the environment
        - pattern: ^time\.Sleep$
          msg: tests synchronise on events or the fake clock, never on a sleep
        # The bootstrap package reaches every file through os.OpenRoot on its folder, never by
        # a path; these calls take one. Scoped to it below.
        - pattern: ^os\.(Open|OpenFile|Create|CreateTemp|ReadFile|WriteFile|Rename|Remove|RemoveAll|Stat|Lstat|Chmod|Chown|Lchown|Chtimes|Chdir|ReadDir|Mkdir|MkdirAll|MkdirTemp|Link|Symlink|Readlink|Truncate|DirFS)$
          msg: the bootstrap package reaches files only through os.Root
        - pattern: ^syscall\.(Open|Openat|Creat|Rename|Unlink|Mkdir|Rmdir|Chmod|Chown|Lchown|Chdir|Link|Symlink|Readlink|Stat|Lstat|Truncate|CreateFile|DeleteFile|MoveFile|CreateDirectory|RemoveDirectory)$
          pkg: ^syscall$
          msg: the bootstrap package reaches files only through os.Root
        - pattern: ^unix\.(Open|Openat|Openat2|Creat|Rename|Renameat|Renameat2|Unlink|Unlinkat|Mkdir|Mkdirat|Rmdir|Chmod|Fchmodat|Chown|Fchownat|Lchown|Chdir|Link|Linkat|Symlink|Symlinkat|Readlink|Readlinkat|Stat|Lstat|Fstatat|Truncate)$
          pkg: ^golang\.org/x/sys/unix$
          msg: the bootstrap package reaches files only through os.Root
        - pattern: ^windows\.(CreateFile|DeleteFile|MoveFile|MoveFileEx|CreateDirectory|RemoveDirectory|SetFileAttributes|GetFileAttributes|GetFileAttributesEx|FindFirstFile|CreateHardLink|CreateSymbolicLink|SetCurrentDirectory)$
          pkg: ^golang\.org/x/sys/windows$
          msg: the bootstrap package reaches files only through os.Root
    gosec:
      excludes:
        - G104 # errcheck already reports an unchecked error
      config:
        global:
          # gosec's own "#nosec" comment silences a finding without the word nolint, past every
          # check on nolint; with this set, gosec ignores it and reports the finding anyway.
          nosec: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: receiver-naming
        - name: var-naming
        - name: exported
        - name: unused-parameter
  exclusions:
    rules:
      # The only exception to the unsafe ban: the bootstrap package's one small file for the
      # Windows key store (NCrypt), which golang.org/x/sys does not wrap, so its calls take raw
      # pointers. The developer's decision, 2026-10-08; read line by line at review.
      - path: internal/bootstrap/keystore_windows\.go
        linters: [depguard]
        text: import 'unsafe'
      # systemd tells a service where its decrypted credentials are by CREDENTIALS_DIRECTORY
      # (systemd.exec(5)); it is neither a setting nor a secret. This one file reads it.
      - path: internal/bootstrap/credentials_linux\.go
        linters: [forbidigo]
        text: os\.LookupEnv
      # The ban on calls that take a path is the bootstrap package's, and binds its product code,
      # not its tests, which set up folders to open.
      - path-except: internal/bootstrap/
        linters: [forbidigo]
        text: only through os\.Root
      - path: internal/bootstrap/.*_test\.go
        linters: [forbidigo]
        text: only through os\.Root
      # A contract.go is a unit's whole surface, declared at the owner and locked; the
      # small-interface rule applies to consumers, which declare the slice they call.
      - path: contract\.go
        linters: [interfacebloat]
      - path: internal/secrets/
        linters: [forbidigo]
        text: os\.(Getenv|LookupEnv)
      # A tool under tools/ is a command whose output is its findings and which runs go
      # itself; the print and subprocess rules are for the engine.
      - path: tools/
        linters: [forbidigo, gosec]
        text: fmt\.Print|G204|G703
      # The sleep ban is for tests; production code may sleep on a context.
      - path-except: _test\.go
        linters: [forbidigo]
        text: time\.Sleep
      - path: _test\.go
        linters: [forbidigo]
        text: io\.ReadAll
      # A test may drop an error on purpose, written as a blank assignment so the drop is
      # visible; the check-blank rule is for production code.
      - path: _test\.go
        linters: [errcheck]
        source: '(^\s*|[{;] )(_|_, _) = '
      # A test launches the oracle and reads the files it made; gosec's subprocess and
      # path warnings are the test doing its job.
      - path: _test\.go
        linters: [gosec]
        text: G(204|304|703)

formatters:
  enable:
    - gofmt
    - goimports
