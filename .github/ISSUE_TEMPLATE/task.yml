name: Task
description: One unit of work for the loop. Only the developer opens one.
labels: ["qa"]
body:
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: The lines from the brief this task builds to, verbatim, one per line. The QA session writes one test per line; the session ticks them in the PR body.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: The packages or files the task may touch. A change outside them is listed under its own heading in the PR or the PR is wrong.
    validations:
      required: true
  - type: input
    id: qa
    attributes:
      label: QA commit
      description: Filled in when the tests are approved, by the developer, with the short hash of the commit carrying `Helios-Role: qa`. The loop claims nothing without it.
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Task list. The session ticks each box with a one-line comment as it lands. Empty means the session writes one as its first comment and waits for a thumbs-up.
      value: |
        - [ ]
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else the session needs. Short.
