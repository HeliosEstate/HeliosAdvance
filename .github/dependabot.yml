# Dependabot keeps three things current, each as a pull request from its bot that the check
# workflow judges and the developer merges like any other: the GitHub Actions the workflows use,
# the Go module's dependencies, and the base image of the bootstrap file oracle's Dockerfile.
# Actions are pinned by commit hash with their version in a comment, and the image by digest, so a
# moved tag cannot change what runs (the developer, 2026-11-12); Dependabot updates both the hash
# or digest and the comment. It cannot reach the four tool pins inside the workflows' shell steps;
# the weekly tool-pins workflow watches those. New releases wait out Dependabot's default three-day
# cooldown before a pull request (developer, 2026-10-14).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /oracle/bootstrap-file
    schedule:
      interval: weekly
