# Dependabot keeps two things current, each as a pull request from its bot that the check
# workflow judges and the developer merges like any other: the GitHub Actions the workflows use,
# and the Go module's dependencies. Actions are pinned by commit hash with their version in a
# comment, so a moved tag cannot change an action's own code (the developer, 2026-11-12). One,
# ossf/scorecard-action, starts a container image that its own repository names by tag, which a
# pin of ours cannot fix. Dependabot updates the hash and the comment together. It cannot reach
# the four tool pins inside the workflows' shell steps; the weekly tool-pins workflow watches
# those. New releases wait out Dependabot's default three-day cooldown before a pull request
# (developer, 2026-10-14). The bootstrap file oracle's Dockerfile pins its base image by digest
# and is not watched: no workflow builds that image, so a bump would merge unproven, and a base
# image built by hand gains little from being newer (the developer, 2026-11-12). The Actions'
# version updates come as one weekly pull request, one run and one signoff; a security update,
# for an action or the Go module, still comes on its own as soon as its advisory lands, to be
# applied quickly (the developer, 2026-11-12).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
