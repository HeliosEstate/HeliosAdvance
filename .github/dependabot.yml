# Dependabot keeps two things current, each as a pull request from its bot that the check
# workflow judges and the developer merges like any other: the GitHub Actions the workflows use,
# and the Go module's dependencies. Actions are pinned by commit hash with their version in a
# comment, so a moved tag cannot change the action code that runs (the developer, 2026-11-12);
# Dependabot updates the hash and the comment together. It cannot reach the four tool pins inside
# the workflows' shell steps; the weekly tool-pins workflow watches those. New releases wait out
# Dependabot's default three-day cooldown before a pull request (developer, 2026-10-14). The
# bootstrap file oracle's Dockerfile pins its base image by digest and is not watched: no workflow
# builds that image, so a bump would merge unproven, and a base image built by hand gains little
# from being newer (the developer, 2026-11-12).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
