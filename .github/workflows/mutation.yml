# Mutation testing, nightly, on what changed in the last day: a report of what the approved
# tests miss, for QA to read (a report, not a gate: the developer, 2026-10-22). Each pull
# request also runs it on its own changes, stopped at an hour (check.yml); this nightly run
# covers what merged in a day, and its five hours allow for each fault
# running its package's tests, the Listener's five minutes among them; a red run here means the
# tool could not report.
name: mutation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Mutate everything changed since this commit (default: the last day)"
        required: false

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The versions are pinned in .github/tool-versions, one place for every workflow.
      - name: Install gates
        run: |
          source .github/tool-versions
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$GOLANGCI_LINT/install.sh" | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT"
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK"
          go install github.com/go-gremlins/gremlins/cmd/gremlins@"$GREMLINS"
          # check.sh --mutation runs the license gate too (the codebase review, 2026-10-24).
          go install github.com/google/go-licenses/v2@"$GO_LICENSES"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Plink, the outside Telnet client Part 4's Telnet rows drive as an oracle, is not on the
      # runner's image; it comes from Ubuntu's signed archive, as in check.yml.
      - name: Install Plink
        run: sudo apt-get update -q && sudo apt-get install -y -q putty-tools && plink -V
      # PostgreSQL's tools, the database tests' oracle, as in check.yml: on the image, on no PATH.
      - name: PostgreSQL's tools
        id: postgres
        run: |
          compgen -G '/usr/lib/postgresql/*/bin/initdb' > /dev/null || { echo "::error::no PostgreSQL on this runner"; exit 1; }
          echo "bin=$(dirname "$(printf '%s\n' /usr/lib/postgresql/*/bin/initdb | sort -V | tail -n 1)")" >> "$GITHUB_OUTPUT"
      - name: Mutate the last day's changes
        env:
          RACE: -race
          BASE_INPUT: ${{ inputs.base }}
          PGDIR: ${{ steps.postgres.outputs.bin }}
        run: |
          export PATH="$PGDIR:$PATH"
          base=$(git rev-list -1 --before="24 hours ago" origin/development)
          if [ -n "$BASE_INPUT" ]; then base=$(git rev-parse --verify "$BASE_INPUT^{commit}"); fi
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then echo "nothing changed in the last day"; exit 0; fi
          echo "mutating $base..HEAD"
          BASE="$base" bash check.sh --mutation
