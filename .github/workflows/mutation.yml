# Mutation testing, nightly, on what changed in the last day: a report of what the approved
# tests miss, for QA to read (a report, not a gate: the developer, 2026-10-22). Each pull
# request also runs it on its own changes, stopped at an hour (check.yml); this nightly run
# covers what merged in a day, with the race detector, and its five hours allow for oracle
# tests at twenty-five seconds a run; a red run here means the tool could not report.
name: mutation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Mutate everything changed since this commit (default: the last day)"
        required: false

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The versions are pinned in .github/tool-versions, one place for every workflow.
      - name: Install gates
        run: |
          source .github/tool-versions
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT"
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK"
          go install github.com/go-gremlins/gremlins/cmd/gremlins@"$GREMLINS"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The same cache as check.yml's, for the same reason: Docker Hub's 429.
      - name: Restore the oracle images
        id: oracle-images
        uses: actions/cache/restore@v6
        with:
          path: ~/oracle-images
          key: oracle-images-${{ runner.arch }}-${{ hashFiles('oracle/**') }}
          restore-keys: oracle-images-${{ runner.arch }}-
      - name: Build the oracles
        run: bash .github/oracle-images.sh ~/oracle-images
      - name: Save the oracle images
        if: steps.oracle-images.outputs.cache-hit != 'true' && hashFiles('oracle/**') != ''
        uses: actions/cache/save@v6
        with:
          path: ~/oracle-images
          key: ${{ steps.oracle-images.outputs.cache-primary-key }}
      - name: Mutate the last day's changes
        env:
          RACE: -race
          BASE_INPUT: ${{ inputs.base }}
        run: |
          base=$(git rev-list -1 --before="24 hours ago" origin/development)
          if [ -n "$BASE_INPUT" ]; then base=$(git rev-parse --verify "$BASE_INPUT^{commit}"); fi
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then echo "nothing changed in the last day"; exit 0; fi
          echo "mutating $base..HEAD"
          BASE="$base" bash check.sh --mutation
