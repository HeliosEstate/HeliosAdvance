# Mutation testing: it plants small faults in the engine's code and reports those no test catches,
# a test of the tests for QA to read (a report, not a gate: the developer, 2026-10-22). It runs
# where its report is read, outside the required check (the CI recommendation's item 4, approved
# 2026-10-30):
# - a loop's build pull request (feature/issue-*) that changes engine code, on each push, over
#   the pull request's changed lines, so the report is there when QA reads the build;
# - a QA pull request (qa/*) that changes or removes existing tests, over the whole packages whose
#   tests changed, so a weakened row is seen before it merges;
# - a milestone's close, over the whole engine, beside the full codebase review.
# Other pull requests (QA's new rows alone, contracts, the harness) start none. A red run means
# the tool could not report.
name: mutation

on:
  pull_request:
    branches: [development]
  milestone:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request supersedes the run in flight, whose report would be stale.
# The event is in the name too: a milestone's whole-engine run and a manual run both run on
# development, and one must not cancel the other's report.
concurrency:
  group: mutation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    # Pull requests from this repository's own branches only: the loop's and QA's.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A bound on a hang only: a mutation run's length is not limited.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'development' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # What to mutate, or nothing. A build is judged whole, from where it left development, never
      # by its last push alone. Judged by its last push alone, a push of tests, or a merge of
      # development bringing no engine code, mutated nothing, so a report that push cancelled, or
      # one an earlier push failed to make, never came. A build whose changes are only tests or a
      # contract's declarations starts nothing; nor does a QA change that only adds rows. The
      # engine's code is internal/, but for the test support; cmd/'s tests run the built program,
      # which mutation testing cannot see into. A QA change counts a renamed test, or a changed file
      # its rows read from testdata/, as a changed test. A milestone mutates the whole module, which
      # check.sh's exclusions bring down to the engine's code.
      - name: What to mutate
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          engine() { grep -E '^internal/' | grep -vE '^internal/testrun(/|$)' || true; }
          if [ "$EVENT" != pull_request ]; then
            echo "packages=." >> "$GITHUB_OUTPUT"
            echo "base=HEAD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base origin/development HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          case "$HEAD_REF" in
            feature/issue-*)
              if git diff --name-only "$base" HEAD -- '*.go' ':!*_test.go' ':!*/contract.go' | engine | grep -q .; then
                echo "diff=1" >> "$GITHUB_OUTPUT"
              fi ;;
            qa/*)
              echo "packages=$(git diff --name-only --no-renames --diff-filter=MD "$base" HEAD -- '*_test.go' '*/testdata/*' | sed 's|/testdata/.*|/x|' | xargs -r -n1 dirname | sort -u | engine | sed 's|^|./|' | tr '\n' ' ')" >> "$GITHUB_OUTPUT" ;;
          esac
      # gremlins is not installed here: check.sh --mutation installs it at the version pinned in
      # .github/tool-versions.
      # Plink, the outside Telnet client Part 4's Telnet rows drive as an oracle, is not on the
      # runner's image; it comes from Ubuntu's signed archive, as in check.yml.
      - name: Install Plink
        if: steps.scope.outputs.diff || steps.scope.outputs.packages
        run: sudo apt-get update -q && sudo apt-get install -y -q putty-tools && plink -V
      # Free Pascal, which builds the bootstrap file oracle the tests make every bootstrap file
      # with; from Ubuntu's signed archive, as in check.yml.
      - name: Install Free Pascal
        if: steps.scope.outputs.diff || steps.scope.outputs.packages
        run: sudo apt-get update -q && sudo apt-get install -y -q fp-compiler && fpc -iV
      # PostgreSQL's tools, the database tests' oracle: the image's newest, on no PATH.
      - name: PostgreSQL's tools
        if: steps.scope.outputs.diff || steps.scope.outputs.packages
        id: postgres
        run: |
          compgen -G '/usr/lib/postgresql/*/bin/initdb' > /dev/null || { echo "::error::no PostgreSQL on this runner"; exit 1; }
          echo "bin=$(dirname "$(printf '%s\n' /usr/lib/postgresql/*/bin/initdb | sort -V | tail -n 1)")" >> "$GITHUB_OUTPUT"
      # The gates are the required check's, so they are skipped here.
      # The run is held in one control group of at most 12 GiB of memory, out of the runner's 16.
      # A mutant can make its tests grow memory without bound, and several run at once: unheld,
      # they took the whole runner down, and no report came. When the group is full, the kernel
      # stops one process in it, by its own score, which favors the one using the most memory.
      # Which process it stops is the kernel's choice and is not pinned here. In a trial run the
      # limit stopped one process and the run finished; the log does not say which. If it stops
      # the runaway test, that test fails and its mutant counts as caught. If it stops gremlins or
      # check.sh, the run goes red with no report; if it stops a server another test uses, that
      # test fails and its mutant counts as caught when it may not be. OOMPolicy=continue keeps
      # systemd from stopping the rest of the run at the first stop. The limit is on real memory,
      # not reserved address space, which a test binary holds far more of than it uses. The report
      # says how many processes the limit stopped, of any kind (the developer's decisions,
      # 2026-11-11). sudo starts from a clean environment: a variable the run needs goes in the
      # list after "sudo env" below, as well as in env:.
      - name: Mutate
        if: steps.scope.outputs.diff || steps.scope.outputs.packages
        env:
          PGDIR: ${{ steps.postgres.outputs.bin }}
          MUTATE: ${{ steps.scope.outputs.packages }}
          BASE: ${{ steps.scope.outputs.base }}
          GATES: "0"
        run: |
          export PATH="$PGDIR:$PATH"
          if [ -n "$MUTATE" ]; then echo "mutating, whole: $MUTATE"; else echo "mutating the pull request's changed lines"; fi
          sudo env "PATH=$PATH" "HOME=$HOME" "MUTATE=$MUTATE" "BASE=$BASE" "GATES=$GATES" \
            "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            systemd-run --scope --quiet --collect \
            -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
            --uid="$(id -u)" --gid="$(id -g)" --same-dir -- bash -c '
              bash check.sh --mutation
              status=$?
              events=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.events
              stopped=$(awk "\$1 == \"oom_kill\" {print \$2}" "$events" 2>/dev/null)
              line="Processes the 12 GiB memory limit stopped: ${stopped:-not read}"
              echo "mutation testing: $line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
              exit $status'
