# Opens an issue labeled noticed for each item of a "Noticed, not touched" list in a pull
# request's body or in a plan written into an issue's body, so that no item depends on a
# session reading every list (developer, 2026-10-10). .github/noticed.sh says how; the
# developer decides each issue, and no merge is handed to him while its pull request or its
# issue has one still labeled noticed.
#
# It reads a list once, at signoff, not at every edit (developer, 2026-10-30): an item is known
# by its text, so each rewording of a line while the work went on opened another issue. The
# developer's gh signoff starts it, for the pull request and for the plan in the issue it closes,
# waits for it, and then refuses while any noticed issue is open. A pull request that merges any
# other way, such as a contract into a build branch, is read when it merges, so no list goes
# unread.
#
# The bodies are data: the script reads them from GitHub and takes them on stdin. It always runs
# as it is on the default branch, development, never a pull request's own copy, so no branch's
# code runs with this workflow's right to write issues. A pull request from a fork opens nothing.
name: noticed

on:
  workflow_dispatch:
    inputs:
      source:
        description: "The body to read: pr-<number> or issue-<number>"
        required: true
  pull_request:
    types: [closed]
    branches: [development, main, 'feature/issue-*']

permissions:
  contents: read
  issues: write

# One run at a time for each body: an issue just opened is missing from GitHub's issue list for
# about ten seconds (seen 2026-10-10), so two runs on one body side by side could open an item
# twice.
concurrency:
  group: noticed-${{ inputs.source || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  open:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source || format('pr-{0}', github.event.pull_request.number) }}
        run: |
          case $SOURCE in
            pr-[0-9]*) path="pulls/${SOURCE#pr-}" ;;
            issue-[0-9]*) path="issues/${SOURCE#issue-}" ;;
          esac
          [[ $SOURCE =~ ^(pr|issue)-[0-9]+$ ]] || { echo "::error::source is pr-<number> or issue-<number>, not $SOURCE"; exit 1; }
          gh api "repos/$GH_REPO/$path" --jq '.body // ""' | bash .github/noticed.sh "$SOURCE"
      # Holds the concurrency group until an issue this run opened shows in the list (about
      # ten seconds, measured 2026-10-10), so the next run finds it and opens no second one,
      # even when this run failed part way.
      - if: always()
        run: sleep 20
