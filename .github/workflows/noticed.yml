# Opens an issue labeled noticed for each item of a "Noticed, not touched" list in a pull
# request's body or in a plan written into an issue's body, so that no item depends on a
# session reading every list (developer, 2026-10-10). .github/noticed.sh says how; the
# developer decides each issue, and no merge is handed to him while its pull request or its
# issue has one still labeled noticed.
#
# It reads a list once, at signoff, not at every edit (developer, 2026-10-30): an item is known
# by its text, so each rewording of a line while the work went on opened another issue. The
# developer's gh signoff starts it, for the pull request and for the plan in the issue it closes,
# waits for it, and then refuses while any noticed issue is open. A same-repository pull request
# that merges is read again when it merges, so a contract merged into a build branch is read, and
# so is a line added after signoff, though then only after the merge. A build branch made before
# this change keeps the old per-edit workflow until it takes in development.
#
# The bodies are data: the run reads them from GitHub and gives them to the script on stdin. The
# script is always the default branch's copy; a started run also takes this file from the default
# branch only, and a merge's run takes it from the branch merged into. A fork's pull request and
# an issue opened by anyone but the developer or the estate's Apps are not read: their text is
# not the estate's.
name: noticed
run-name: noticed ${{ inputs.source || format('pr-{0}', github.event.pull_request.number) }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: "The body to read: pr-<number> or issue-<number>"
        required: true
  pull_request:
    types: [closed]
    branches: [development, main, 'feature/issue-*']

permissions:
  contents: read
  issues: write

# One run at a time for each body: an issue just opened is missing from GitHub's issue list for
# about ten seconds (seen 2026-10-10), so two runs on one body side by side could open an item
# twice.
concurrency:
  group: noticed-${{ inputs.source || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  open:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      # shell: bash stops on a failure anywhere in a pipe, so a body that could not be read fails
      # the run, and signoff with it, instead of reading as a list with nothing in it.
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source || format('pr-{0}', github.event.pull_request.number) }}
        run: |
          [[ $SOURCE =~ ^(pr|issue)-[0-9]+$ ]] || { echo "::error::source is pr-<number> or issue-<number>, not $SOURCE"; exit 1; }
          case $SOURCE in
            pr-*) path="pulls/${SOURCE#pr-}" ;;
            issue-*) path="issues/${SOURCE#issue-}" ;;
          esac
          read=$(gh api "repos/$GH_REPO/$path")
          if [[ $SOURCE == pr-* ]]; then
            head=$(jq -r '.head.repo.full_name // ""' <<< "$read")
            [ "$head" = "$GH_REPO" ] || { echo "::notice::$SOURCE comes from a fork; its list is not read"; exit 0; }
          else
            author=$(jq -r '.user.login' <<< "$read")
            case $author in
              Paswaru|helios-aegle\[bot\]|helios-aetheria\[bot\]|helios-lampetia\[bot\]|helios-phaethusa\[bot\]) ;;
              *) echo "::notice::$SOURCE was opened by $author; its list is not read"; exit 0 ;;
            esac
          fi
          jq -r '.body // ""' <<< "$read" | bash .github/noticed.sh "$SOURCE"
      # Holds the concurrency group until an issue this run opened shows in the list (about
      # ten seconds, measured 2026-10-10), so the next run finds it and opens no second one,
      # even when this run failed part way.
      - if: always()
        run: sleep 20
