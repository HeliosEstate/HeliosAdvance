# Fuzzes every fuzz target each night, ten minutes each (HeliosDesign #258's CI work, the
# developer's approval of 2026-10-30). check.sh runs each target's seeds alone, so without this no
# run ever fuzzes, and the rule for a parser of a caller's bytes, a fuzz target that fuzzes, would
# hold in name only. The targets are found by listing, so a new one is fuzzed without anyone
# naming it here, and the inputs each night finds worth keeping carry over to the next.
#
# A failing input is a security finding, kept private (developer, 2026-10-30): the run's log says
# only whether a target failed, never the input or the failure, since this repository and its logs
# are public; the input, the failure and the line that replays it go to code scanning, whose
# alerts only those with write access see. The fix is tested as every security fix is: its pull
# request adds the input to the target's seeds, red until the engine is fixed, and the next night
# that target uploads no finding, which closes the alert. The input becomes public with that pull
# request, as any security fix's test does.
name: fuzz

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two runs never report one target's finding twice.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Only the packages whose tests declare a fuzz target are listed: listing every package
      # would build and start them all, PostgreSQL's included, to print a few names.
      - name: List the fuzz targets
        id: list
        shell: bash
        run: |
          mapfile -t dirs < <(grep -rl --include='*_test.go' '^func Fuzz' . | xargs -r -n1 dirname | sort -u)
          [ "${#dirs[@]}" -gt 0 ] || { echo "::error::no fuzz target found"; exit 1; }
          list=$(go test -list '^Fuzz' "${dirs[@]}" | awk -v mod="$(go list -m)" '
            /^Fuzz/ { names[n++] = $1; next }
            /^ok/ { pkg = $2; sub("^" mod, ".", pkg); for (i = 0; i < n; i++) printf "%s{\"pkg\":\"%s\",\"name\":\"%s\"}", (out++ ? "," : "["), pkg, names[i]; n = 0 }
            END { print (out ? "]" : "[]") }')
          echo "$list"
          [ "$list" != "[]" ] || { echo "::error::no fuzz target found"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    name: fuzz (${{ matrix.target.pkg }} ${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Where the kept inputs live
        id: corpus
        shell: bash
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: |
          echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
          echo "key=fuzz-$(printf '%s' "$PKG/$NAME" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: ${{ steps.corpus.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.corpus.outputs.key }}-
      # The test code runs here with no token: nothing in this step can write anywhere. Its output
      # stays in a file; the public log gets one line.
      - name: Fuzz for ten minutes
        id: fuzz
        shell: bash
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: |
          if go test -run '^$' -fuzz "^$NAME\$" -fuzztime 10m "$PKG" > "$RUNNER_TEMP/fuzz.txt" 2>&1; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "$NAME: no failing input"
          else
            echo "found=1" >> "$GITHUB_OUTPUT"
            echo "$NAME: a failing input or a failure; the details are in code scanning, not here"
          fi
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: ${{ steps.corpus.outputs.key }}-${{ github.run_id }}
      # One result for a failure, none for a clean run: a clean run under the same category closes
      # the target's open alert, which is how a fix is seen to hold.
      - name: The finding, for code scanning
        if: always() && steps.fuzz.outcome == 'success'
        shell: bash
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
          FOUND: ${{ steps.fuzz.outputs.found }}
        run: |
          file=$(grep -l --include='*_test.go' -r "^func $NAME(" "$PKG" | head -1)
          line=$(grep -n "^func $NAME(" "$file" | head -1 | cut -d: -f1)
          id="fuzz/${PKG#./}/$NAME"
          if [ -n "$FOUND" ]; then
            written=$(grep -oE 'testdata/fuzz/[^ ]+' "$RUNNER_TEMP/fuzz.txt" | tail -1 || true)
            {
              echo "Fuzzing found an input $NAME in $PKG fails on."
              echo
              if [ -n "$written" ] && [ -f "$PKG/$written" ]; then
                echo "The input, as Go wrote it to $PKG/$written:"
                echo
                head -c 8000 "$PKG/$written"
                echo
                echo
                echo "Replayed, with the file in place: go test -run '^$NAME/$(basename "$written")\$' $PKG"
              else
                echo "Go wrote no input file: the failure came from a seed or before fuzzing began."
              fi
              echo
              echo "The failure:"
              echo
              grep -v '^fuzz: elapsed' "$RUNNER_TEMP/fuzz.txt" | tail -40 | head -c 6000
              echo
              echo "The fix's pull request adds the input to the target's seeds, red until the engine is fixed."
            } > "$RUNNER_TEMP/message.txt"
            result=$(jq -n --arg id "$id" --arg file "${file#./}" --argjson line "$line" --rawfile message "$RUNNER_TEMP/message.txt" \
              '[{ruleId: $id, level: "error", message: {text: $message},
                 locations: [{physicalLocation: {artifactLocation: {uri: $file}, region: {startLine: $line}}}],
                 partialFingerprints: {"fuzzTarget/v1": $id}}]')
          else
            result='[]'
          fi
          jq -n --arg id "$id" --arg name "$NAME" --argjson results "$result" \
            '{version: "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              runs: [{tool: {driver: {name: "fuzz", informationUri: "https://go.dev/doc/security/fuzz/",
                       rules: [{id: $id, shortDescription: {text: ("Fuzzing found an input " + $name + " fails on")}}]}},
                      automationDetails: {id: ($id + "/")}, results: $results}]}' > "$RUNNER_TEMP/fuzz.sarif"
          echo "category=$(printf '%s' "$id" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
        id: sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outcome == 'success'
        with:
          sarif_file: ${{ runner.temp }}/fuzz.sarif
          category: ${{ steps.sarif.outputs.category }}
      - name: A failing input fails the job
        if: steps.fuzz.outputs.found == '1'
        run: exit 1
