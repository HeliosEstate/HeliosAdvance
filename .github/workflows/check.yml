name: check

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight: a stale run can post a
# stale green, and attempt one paid for every superseded run in full.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One Linux runner reads the change set and runs the cheap gates, which need no Go. A
  # docs-only change set stops here: only Markdown, files under docs/, developer-owned-paths,
  # and files under .github/ other than this one. Anything else, a file nobody listed
  # included, starts the full matrix below. A change to this file always runs in full, since
  # it is the CI being changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Change set
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"; else base="HEAD^"; fi
          files=$(git diff --name-only "$base...HEAD" 2>/dev/null || git diff --name-only HEAD^ HEAD)
          printf '%s\n' "$files"
          rest=$(printf '%s\n' "$files" | grep -vE '\.md$' | grep -vE '^docs/' | grep -vxF 'developer-owned-paths' | grep -vE '^\.github/' || true)
          full=$(printf '%s\n' "$files" | grep -xF '.github/workflows/check.yml' || true)
          if [ -n "$files" ] && [ -z "$rest" ] && [ -z "$full" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - name: Cheap gates
        env:
          SKIP_GO: "1"
          BASE: origin/${{ github.base_ref || 'development' }}
        run: bash check.sh

  # The two Linux architectures the engine ships on, ARM64 the deployment target, run every
  # gate with the race detector and the oracles. Windows runs build, vet, lint, namecheck
  # and compiles every test: its runners cannot run Linux containers, so the oracle rows
  # cannot run there, and the race detector would need a C compiler installed every run.
  # Database tests will be Linux-only for the same reason (developer, 2026-10-02).
  run:
    needs: changes
    if: needs.changes.outputs.skip == '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows checks out CRLF by default, and gofmt reads CRLF as unformatted.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gates
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          else
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          fi
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Every oracle the tree holds, none on a tree without any: main is the skeleton.
      - name: Build the oracles
        if: runner.os == 'Linux'
        run: for d in oracle/*/; do [ -d "$d" ] && docker build -q -t "heliosestate/$(basename "$d")-oracle:0.1" "$d"; done; true
      - name: check.sh
        env:
          RACE: ${{ runner.os == 'Linux' && '-race' || '' }}
          COVER: ${{ runner.os == 'Linux' && '-coverprofile=coverage.out' || '' }}
          TESTRUN: ${{ runner.os == 'Windows' && '^$' || '' }}
          BASE: origin/${{ github.base_ref || 'development' }}
        run: bash check.sh
      # Coverage is a report, never a gate: a percentage fails nothing. Mutation testing is
      # the gate on test strength.
      - name: Coverage report
        if: always() && runner.os == 'Linux'
        run: |
          [ -f coverage.out ] || { echo "no coverage profile: the tests did not run" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage on ${{ matrix.os }}: $(go tool cover -func=coverage.out | awk '$1=="total:"{print $NF}')"
            echo
            echo '| Package | Statements covered |'
            echo '|---|---|'
            go tool cover -func=coverage.out | awk '$1!="total:"{split($1,a,":"); d=a[1]; sub(/\/[^\/]*$/,"",d); sub(/^github.com\/heliosestate\/heliosadvance\//,"",d); p=$NF; sub(/%/,"",p); n[d]++; s[d]+=p} END{for(k in n) printf "| %s | %.1f%% |\n", k, s[k]/n[k]}' | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # The ruleset requires this one job. It passes when the cheap gates passed and the matrix
  # either passed or was skipped for a docs-only change set; a skipped matrix on any other
  # change set fails it, so a required check never sits unreported.
  check:
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # main holds releases and what GitHub reads from the default branch, nothing else: a
      # pull request into it comes from development, a release or hotfix branch, or a
      # github/* branch carrying .github/ into step. A stranger's PR defaults to main and
      # is refused here, not merged by accident.
      - if: github.base_ref == 'main' && !(github.head_ref == 'development' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') || startsWith(github.head_ref, 'github/'))
        run: |
          echo "::error::a pull request into main comes from development, release/*, hotfix/* or github/*, not ${{ github.head_ref }}"
          exit 1
      - run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.skip }}" = 1 ]; then
            test "${{ needs.run.result }}" = skipped
          else
            test "${{ needs.run.result }}" = success
          fi
