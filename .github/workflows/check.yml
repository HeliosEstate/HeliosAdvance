name: check

on:
  pull_request:
    branches: [development, main]
  # A push to a QA or build branch runs CI too, so QA proves its rows red and measures the
  # runners without dispatching a run: the estate's App cannot dispatch, and is not given
  # Actions: write, which could switch a workflow off (developer, 2026-10-16). Only the App and
  # the loops push branches here. A branch that has a pull request also gets that run.
  push:
    branches: [development, main, "feature/**", "qa/**"]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight: a stale run can post a
# stale green, and attempt one paid for every superseded run in full.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One Linux runner reads the change set and runs the cheap gates, which need no Go. A
  # docs-only change set stops here: only Markdown, files under docs/, the three list files
  # (developer-owned-paths, security-paths, loop-identities, which the cheap gates read), and
  # files under .github/ other than this one and .github/tool-versions. Anything else, a file
  # nobody listed included, starts the full matrix below. A change to this file or to the tool
  # pins always runs in full, since it is the CI being changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Change set
        id: changes
        # On a push the change set is everything the push brought, from the commit before it, not
        # only the last commit; a new branch or an unreachable one runs everything (the codebase
        # review, 2026-10-24).
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base...HEAD" 2>/dev/null || git diff --name-only HEAD^ HEAD)
          printf '%s\n' "$files"
          rest=$(printf '%s\n' "$files" | grep -vE '\.md$' | grep -vE '^docs/' | grep -vxE 'developer-owned-paths|security-paths|loop-identities' | grep -vE '^\.github/' || true)
          full=$(printf '%s\n' "$files" | grep -xE '\.github/workflows/check\.yml|\.github/tool-versions' || true)
          if [ -n "$files" ] && [ -z "$rest" ] && [ -z "$full" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - name: Cheap gates
        env:
          SKIP_GO: "1"
          BASE: origin/${{ github.base_ref || 'development' }}
        run: bash check.sh

  # The three systems the engine ships on, Linux x86-64, Linux ARM64 (the deployment target) and
  # Windows x86-64, each twice: without the race detector, where time limits are judged, and with
  # it, where races are looked for and no time is judged (HeliosDesign #258). Windows' image
  # carries a C compiler, so the race detector runs there with nothing installed. Windows skips
  # the tests named TestOracle… or TestLinux…: its runners cannot run Linux containers, and a
  # Linux-only row is named for it. Database tests run on all three, against a real PostgreSQL the
  # tests make themselves (database Part 1's page, 2026-10-27).
  # The tests are split across jobs by their measured time, each job running its packages one at a
  # time: the Listener's five minutes are real waits on its own limits, the floor no split goes
  # under, so Linux takes two jobs and Windows, slower, three. The Go gates run once per system,
  # before the tests in that system's shortest job without the race detector, never beside a timed
  # row (#258's probes, 2026-10-30).
  # On a pull request, the row marked mutation (Linux x86-64, without the race detector, the
  # rest) also runs check.sh's mutation mode on the changed code, so a weak test is found before
  # the developer reviews. It stops at an hour, a limit the developer agreed on 2026-10-16.
  # A row's except names packages from the module's root, so a package nested deeper under the
  # same name is still tested.
  run:
    needs: changes
    if: needs.changes.outputs.skip == '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, mode: norace, group: listener, pkgs: ./internal/listener, gates: true }
          - { os: ubuntu-latest, mode: norace, group: rest, except: "internal/listener", gates: false, mutation: true }
          - { os: ubuntu-latest, mode: race, group: listener, pkgs: ./internal/listener, gates: false }
          - { os: ubuntu-latest, mode: race, group: rest, except: "internal/listener", gates: false }
          - { os: ubuntu-24.04-arm, mode: norace, group: listener, pkgs: ./internal/listener, gates: true }
          - { os: ubuntu-24.04-arm, mode: norace, group: rest, except: "internal/listener", gates: false }
          - { os: ubuntu-24.04-arm, mode: race, group: listener, pkgs: ./internal/listener, gates: false }
          - { os: ubuntu-24.04-arm, mode: race, group: rest, except: "internal/listener", gates: false }
          - { os: windows-latest, mode: norace, group: listener, pkgs: ./internal/listener, gates: false }
          - { os: windows-latest, mode: norace, group: database, except: "internal/listener|cmd/.*|internal/ssh", gates: true }
          - { os: windows-latest, mode: norace, group: program, pkgs: "./cmd/... ./internal/ssh", gates: false }
          - { os: windows-latest, mode: race, group: listener, pkgs: ./internal/listener, gates: false }
          - { os: windows-latest, mode: race, group: database, except: "internal/listener|cmd/.*|internal/ssh", gates: false }
          - { os: windows-latest, mode: race, group: program, pkgs: "./cmd/... ./internal/ssh", gates: false }
    name: run (${{ matrix.os }}, ${{ matrix.mode }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows checks out CRLF by default, and gofmt reads CRLF as unformatted.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The versions are pinned in .github/tool-versions, one place for every workflow. The linter
      # is the released binary on every runner: its own documentation says a go install build is
      # not guaranteed to work. Its install script serves Windows (a zip, unpacked with unzip, an
      # .exe) and wants a POSIX path, which cygpath gives from Go's Windows-form GOPATH. Only the
      # job that runs the gates installs them, and only the job that runs mutation testing installs
      # its tool.
      - name: Install gates
        if: matrix.gates || (github.event_name == 'pull_request' && matrix.mutation)
        run: |
          source .github/tool-versions
          if [ "${{ matrix.gates }}" = true ]; then
            bin="$(go env GOPATH)/bin"
            [ "$RUNNER_OS" = Windows ] && bin="$(cygpath -u "$(go env GOPATH)")/bin"
            curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$GOLANGCI_LINT/install.sh" | sh -s -- -b "$bin" "$GOLANGCI_LINT"
            golangci-lint --version
            go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK"
            go install github.com/google/go-licenses/v2@"$GO_LICENSES"
          else go install github.com/go-gremlins/gremlins/cmd/gremlins@"$GREMLINS"; fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Plink, an outside Telnet client that Part 4's Telnet rows drive as an oracle, is on no
      # runner's image; only the program's rows drive it. Linux takes it from Ubuntu's signed
      # archive for the image; Windows takes PuTTY's own installer through winget at a fixed
      # version, checked against the SHA256 in winget's manifest. The installer's folder joins the
      # PATH of later steps by hand, since a running job does not see the PATH an installer changes.
      - name: Install Plink
        if: matrix.group == 'rest' || matrix.group == 'program'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            winget install --id PuTTY.PuTTY -e --version 0.85.0.0 --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
            echo 'C:\Program Files\PuTTY' >> "$GITHUB_PATH"
            export PATH="/c/Program Files/PuTTY:$PATH"
          else sudo apt-get update -q && sudo apt-get install -y -q putty-tools; fi
          plink -V
      # PostgreSQL, the database tests' oracle (database Part 1, HeliosAdvance #159). Each test run
      # makes its own throwaway server in a temporary folder with initdb and pg_ctl, as the
      # ordinary user, so it can stop and start it and change its sign-in rules; no system
      # service is started (developer, 2026-10-28). Each system tests one supported major, so
      # every major the engine supports is tested once (developer, 2026-10-30): 18 on Linux
      # x86-64, 16 on Linux ARM64, 17 on Windows; 19 joins on its release (HeliosDesign #271).
      # Each run takes the major's newest update from PostgreSQL's own packages: on Linux its apt
      # repository; on Windows the image's copy when it is the newest the project publishes, else
      # the project's Windows binaries. A job whose major is not its own fails here. The weekly
      # pg-watch workflow says when an image or a major's support moves. The tools' folder is handed
      # to the steps that run the tests alone, never put on every later step's PATH: on Windows it
      # carries its own copies of shared libraries (OpenSSL, zlib, ICU) that could shadow another
      # tool's (HeliosDesign #229).
      - name: PostgreSQL's tools
        if: matrix.group != 'listener'
        id: postgres
        env:
          PG: ${{ runner.os == 'Windows' && '17' || runner.arch == 'ARM64' && '16' || '18' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            newest="$PG.$(curl -sSf https://www.postgresql.org/versions.json | jq -r --arg m "$PG" '.[] | select(.major == $m) | .latestMinor')"
            bin="$(cygpath -u "$PGBIN")"
            if ! "$bin/pg_ctl" --version | tr -d '\r' | grep -q " $newest\$"; then
              curl -sSfL -o "$RUNNER_TEMP/pg.zip" "https://get.enterprisedb.com/postgresql/postgresql-$newest-1-windows-x64-binaries.zip"
              unzip -q "$RUNNER_TEMP/pg.zip" -d "$RUNNER_TEMP"
              bin="$RUNNER_TEMP/pgsql/bin"
            fi
          else
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
            sudo apt-get install -y -q "postgresql-$PG" > /dev/null
            bin="/usr/lib/postgresql/$PG/bin"
          fi
          "$bin/pg_ctl" --version | tr -d '\r' | grep -qE " $PG\.[0-9]+" ||
            { echo "::error::this job tests PostgreSQL $PG, but its pg_ctl is $("$bin/pg_ctl" --version)"; exit 1; }
          PATH="$bin:$PATH" initdb --version
          PATH="$bin:$PATH" pg_ctl --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      # The packages this job tests: those its row names, or every package but those its row
      # excepts, so a package added later lands in a job without anyone listing it.
      - name: check.sh
        env:
          RACE: ${{ matrix.mode == 'race' && '-race' || '' }}
          CGO_ENABLED: ${{ matrix.mode == 'race' && '1' || '' }}
          COVER: ${{ runner.os == 'Linux' && matrix.mode == 'norace' && '-coverprofile=coverage.out' || '' }}
          TESTSKIP: ${{ runner.os == 'Windows' && '^(TestOracle|TestLinux)' || '' }}
          GATES: ${{ matrix.gates && '1' || '0' }}
          ONLY: ${{ matrix.pkgs }}
          EXCEPT: ${{ matrix.except }}
          PGDIR: ${{ steps.postgres.outputs.bin }}
          BASE: origin/${{ github.base_ref || 'development' }}
        run: |
          PKGS=$ONLY
          if [ -n "$EXCEPT" ]; then mod=$(go list -m); PKGS=$(go list ./... | grep -vE "^${mod//./\\.}/($EXCEPT)\$" | tr '\n' ' '); fi
          [ -n "$PKGS" ] || { echo "::error::this job has no package to test"; exit 1; }
          echo "testing: $PKGS"
          export PKGS
          [ -n "$PGDIR" ] && export PATH="$PGDIR:$PATH"
          bash check.sh
      # The gates ran in this system's gates job, so the mutation run skips them.
      - name: Mutation testing
        if: github.event_name == 'pull_request' && matrix.mutation
        timeout-minutes: 60
        env:
          PGDIR: ${{ steps.postgres.outputs.bin }}
          BASE: origin/${{ github.base_ref }}
          GATES: "0"
        run: |
          export PATH="$PGDIR:$PATH"
          bash check.sh --mutation
      # Nothing a test run makes outlives it (#258): each test program's own folder is gone, and on
      # Linux nothing still runs from one (there a running program does not stop its folder's
      # removal). The runner starts empty, so anything found is this job's, the mutation run's
      # included. The folder is where Go puts temporary files, read the way Go reads it.
      - name: Nothing left behind
        if: success() || failure()
        run: |
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -u "$(pwsh -NoProfile -Command '[IO.Path]::GetTempPath()')")
          else tmp=${TMPDIR:-/tmp}; fi
          left=$(ls -d "${tmp%/}"/hadv-test-run-* 2>/dev/null || true)
          [ "$RUNNER_OS" = Windows ] || left="$left$(pgrep -af "${tmp%/}/hadv-test-run-" || true)"
          [ -z "$left" ] || { echo "$left"; echo "::error::a test run left these behind"; exit 1; }
      # Coverage is a report, never a gate: a percentage fails nothing. Mutation testing is a
      # report too; QA's broken copies are the gate on test strength (the developer, 2026-10-22).
      # It is read from the Linux jobs without the race detector, each table its job's packages.
      - name: Coverage report
        if: always() && runner.os == 'Linux' && matrix.mode == 'norace'
        run: |
          [ -f coverage.out ] || { echo "no coverage profile: the tests did not run" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage on ${{ matrix.os }}, ${{ matrix.group }}: $(go tool cover -func=coverage.out | awk '$1=="total:"{print $NF}')"
            echo
            echo '| Package | Statements covered |'
            echo '|---|---|'
            # Statements, counted from the profile itself: each line after the mode is a block,
            # its statement count and how often it ran. Averaging -func's per-function figures
            # weighted a two-line function like a two-hundred-line one and read high.
            awk 'NR>1{split($1,a,":"); d=a[1]; sub(/\/[^\/]*$/,"",d); sub(/^github.com\/heliosestate\/heliosadvance\//,"",d); t[d]+=$2; if($3>0) c[d]+=$2} END{for(k in t) printf "| %s | %.1f%% (%d of %d) |\n", k, (t[k] ? 100*c[k]/t[k] : 0), c[k], t[k]}' coverage.out | sort
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux' && matrix.mode == 'norace'
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.group }}
          path: |
            coverage.out
            coverage.html
            coverage.md
          if-no-files-found: ignore
          retention-days: 14


  # The coverage table on the pull request itself, as one comment updated on every run. The
  # only job that can write to the pull request, and it runs nothing from the branch: it reads
  # the run job's tables and posts them. It never fails the run, since the loop reads any red
  # check as a red PR; a fork's pull request, whose token cannot write, is skipped.
  coverage:
    needs: run
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
      - name: Post the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '<!-- coverage -->'
            echo "Coverage at ${SHA:0:7}, statements per package. A report, never a gate."
            echo
            for f in coverage-*/coverage.md; do [ -f "$f" ] && { cat "$f"; echo; }; done
          } | head -c 60000 > body.md
          grep -q '^## Coverage' body.md || echo "No coverage table: the tests did not run." >> body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi

  # The ruleset requires this one job. It passes when the cheap gates passed and the matrix
  # either passed or was skipped for a docs-only change set; a skipped matrix on any other
  # change set fails it, so a required check never sits unreported.
  check:
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # main holds releases, nothing else: a pull request into it comes from this repository's
      # development alone, the branch only reviewed pull requests reach (the developer,
      # 2026-10-28, HeliosDesign #219). check.yml runs on no change of base, so a pull request
      # pointed at main after its checks is stopped by main-from-development, which main's
      # ruleset requires, and which also compares the name with its case.
      # The branch name is a stranger's text, so it reaches the shell as data in the environment,
      # never inside the script (the codebase review, 2026-10-24).
      - if: github.base_ref == 'main' && !(github.head_ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::a pull request into main comes from this repository's development alone, not $HEAD_REF"
          exit 1
      - run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.skip }}" = 1 ]; then
            test "${{ needs.run.result }}" = skipped
          else
            test "${{ needs.run.result }}" = success
          fi
