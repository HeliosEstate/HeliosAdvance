name: check

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight: a stale run can post a
# stale green, and attempt one paid for every superseded run in full.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both architectures the engine ships on; ARM64 is the deployment target. The ruleset
  # requires the one job named check, which gathers them.
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gates
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the oracles
        run: docker build -q -t heliosestate/lrzsz-oracle:0.1 oracle/lrzsz
      - name: check.sh
        env:
          RACE: -race
          COVER: -coverprofile=coverage.out
          BASE: origin/${{ github.base_ref || 'development' }}
        run: bash check.sh
      # Coverage is a report, never a gate: a percentage fails nothing. Mutation testing is
      # the gate on test strength.
      - name: Coverage report
        if: always()
        run: |
          [ -f coverage.out ] || { echo "no coverage profile: the tests did not run" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage on ${{ matrix.os }}: $(go tool cover -func=coverage.out | awk '$1=="total:"{print $NF}')"
            echo
            echo '| Package | Statements covered |'
            echo '|---|---|'
            go tool cover -func=coverage.out | awk '$1!="total:"{split($1,a,":"); d=a[1]; sub(/\/[^\/]*$/,"",d); sub(/^github.com\/heliosestate\/heliosadvance\//,"",d); p=$NF; sub(/%/,"",p); n[d]++; s[d]+=p} END{for(k in n) printf "| %s | %.1f%% |
", k, s[k]/n[k]}' | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14
  check:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.run.result }}" = success
