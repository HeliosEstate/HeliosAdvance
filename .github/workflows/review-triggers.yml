# Labels a pull request with the reviews it needs before the developer signs off, from what a
# script can read (developer, 2026-10-05). needs-code-review: it changes anything but
# documentation (a Markdown file, or a file under docs/), since a code review probes any code,
# gates and workflows included (the developer, 2026-10-28). needs-security-review: it touches a
# package in security-paths, a workflow under .github/workflows/ or a script one runs under
# .github/, which run with the repository's tokens, or adds an import of crypto, os/exec, net,
# unsafe, syscall or golang.org/x/sys outside a test. The labels only say which reviews a head
# needs, and the run's summary says it for that head: the loop can take a label off, so nothing
# relies on one. Whether the reviews were done for the head is the reviewing session's record,
# which `gh signoff` itself reads (the developer, 2026-10-28, HeliosDesign #203).
# The run's summary also lists each line the pull request adds that silences a linter (nolint or
# #nosec), skips a test, carries a build tag, or imports unsafe or C, each a decision for the
# developer by name (developer, 2026-10-07: "fail loud"); a line from a QA commit, which he read
# when he approved the tests, does not count. The list is for the session that reviews the pull
# request, which brings each line to him explained, with its file, the line it replaces and why,
# before the merge. The workflow neither labels nor comments for them: a label and a comment
# that quoted bare lines, on the pull request and on whatever issue it closed, stopped the loop
# and gave him nothing to decide on (developer, 2026-10-11: "I can't say yes or no because
# there's no context").
#
# pull_request, never pull_request_target: a stranger's pull request runs with a read-only
# token and cannot use this workflow's rights; its labels are then the developer's to set.
name: review-triggers

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [development, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A loop's build waits for QA to replay its broken copies against the built code before
          # the developer reviews it (agreed with him, 2026-10-16). The label goes on when a loop
          # opens, reopens or pushes to the pull request; QA takes it off, and the signoff refuses
          # while it is on. A push by anyone else, a QA commit included, leaves it as it is.
          loops=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' loop-identities | grep . || true)
          if [ "$ACTION" != edited ] && grep -qxF -- "$SENDER" <<< "$loops"; then
            gh pr edit "$PR" --add-label needs-qa-replay
            echo "needs-qa-replay: on, a loop's build ($SENDER)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          mapfile -t paths < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' security-paths | grep . || true)
          touched=""
          [ "${#paths[@]}" -gt 0 ] && touched=$(git diff --name-only "$BASE...HEAD" -- "${paths[@]}")
          imports=$(git diff -U0 "$BASE...HEAD" -- '*.go' ':!*_test.go' |
            grep -E '^\+[[:space:]]*(import[[:space:]]+)?([[:alnum:]_.]+[[:space:]]+)?"(crypto(/[^"]*)?|os/exec|net(/[^"]*)?|unsafe|syscall|golang\.org/x/sys(/[^"]*)?)"' || true)

          set_label() { # label, wanted
            if [ "$2" = yes ]; then gh pr edit "$PR" --add-label "$1"; else gh pr edit "$PR" --remove-label "$1" || true; fi
          }
          # A workflow, or a script one runs, which runs with the workflow's token. git exits 0
          # when nothing matches, so an error here fails the run rather than reading as no review.
          workflows=$(git diff --name-only "$BASE...HEAD" -- '.github/workflows/' '.github/*.sh' '.github/tool-versions')
          code_files=$(git diff --name-only "$BASE...HEAD" -- . ':(exclude,icase)*.md' ':!docs/')
          security=no; code=no
          [ -n "$touched$imports$workflows" ] && security=yes
          [ -n "$code_files" ] && code=yes
          {
            echo "head: $HEAD_SHA"
            echo "security paths touched: ${touched:-none}"
            echo "imports added outside tests: ${imports:-none}"
            echo "workflows touched: ${workflows:-none}"
            echo "needs-security-review: $security; needs-code-review: $code"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          set_label needs-security-review "$security"
          set_label needs-code-review "$code"

          # A line a QA commit (Helios-Role: qa) added was his to read when he approved the tests,
          # so it is not counted again here (developer, 2026-10-10). Lines are matched with their
          # file, so the same text added by the build still counts.
          added() { awk '/^\+\+\+ /{file = substr($0, 7); next} /^\+/{print file "\t" $0}'; }
          # Found as check.sh's lock gate finds them: the trailer is a paragraph of its own, so
          # git's trailer parsing does not see it; and a trailer counts only on a commit signed by
          # a key in qa-signers or listed in qa-grandfathered, both read from the base, since
          # anyone can type it (the codebase review, issue 82).
          signers=$(mktemp)
          git show "$BASE:qa-signers" > "$signers" 2>/dev/null || : > "$signers"
          grandfathered=$(git show "$BASE:qa-grandfathered" 2>/dev/null || true)
          is_qa() {
            grep -qxF "$1" <<< "$grandfathered" && return 0
            [ -s "$signers" ] && git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signers" verify-commit "$1" >/dev/null 2>&1
          }
          qa_lines=$(git log --format=%H --grep='^Helios-Role: qa$' "$BASE..HEAD" |
            while read -r commit; do is_qa "$commit" && git show -U0 --format= "$commit" -- '*.go' | added; done)
          # Each line as the summary lists it: its file, then the line as added. The file ends at
          # the first tab; the line keeps its own, Go's indentation.
          flagged=$(git diff -U0 "$BASE...HEAD" -- '*.go' | added |
            { grep -vxF -f <(printf '%s\n' "$qa_lines" | grep . || true) || true; } |
            awk '{ tab = index($0, "\t"); file = substr($0, 1, tab - 1); line = substr($0, tab + 1) }
              line ~ /\/\/[[:space:]]*nolint|#nosec|\.Skip(f|Now)?\(|^\+\/\/go:build|"unsafe"|import[[:space:]]+"C"/ {
                sub(/^\+/, "", line); print file ": " line }' || true)
          {
            echo "lines for the developer, brought to him explained before the merge: $(printf '%s' "$flagged" | grep -c . || true)"
            printf '%s\n' "$flagged"
          } | tee -a "$GITHUB_STEP_SUMMARY"
