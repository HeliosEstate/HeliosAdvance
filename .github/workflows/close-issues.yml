# Closes the issues a merged pull request is linked to, when GitHub has not. GitHub closes each
# issue a pull request links once it merges into the default branch, development. It missed once.
# An issue left open keeps its ready label, and the loop would build it again. So this reads the
# pull request's linked issues as GitHub lists them, never the pull request's text, and closes any
# of this repository's that are still open. An issue in another repository is left to GitHub.
name: close-issues

on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A failed lookup fails the run, rather than reading as nothing to close. An issue already
          # closed is passed over by gh issue close, which posts nothing on it.
          linked=$(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[] | select(.repository.owner.login + "/" + .repository.name == env.GH_REPO) | .number')
          for n in $linked; do
            gh issue close "$n" --comment "Closed by the close-issues workflow: the pull request linked to it merged into development, and GitHub had not closed it."
          done
