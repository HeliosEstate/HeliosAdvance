# Closes the issue a merged PR names. GitHub's own "Closes #n" acts only on a merge into the
# default branch, main, and work merges into development; the loop also closes these, but
# only when it next starts, which left #15 open after #46 merged. The PR body is trusted
# because a merge into development needs the developer's signoff.
name: close-issues

on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for n in $(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
            if [ "$(gh issue view "$n" --json state -q .state)" = OPEN ]; then
              gh issue close "$n" --comment "Merged in #$PR into development; closed by the close-issues workflow, since a merge into a non-default branch does not close an issue by itself."
            fi
          done
