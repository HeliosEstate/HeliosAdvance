# OpenSSF Scorecard: an outside check of the repository's supply-chain hygiene (pinned actions,
# token permissions, branch rules, code review, dependency updates, fuzzing, signed releases), its
# findings filed in code scanning beside the codebase review's and the fuzzing's (the developer,
# 2026-11-12). A report, not a gate: a finding the developer accepts is dismissed in code scanning
# with its reason. Its results are not published to the Scorecard site.
name: scorecard

on:
  push:
    branches: [development]
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    # A bound on a hang only.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs in a container and joins results_file to the workspace, even a full path,
      # so the file is named relative to the workspace, where upload-sarif reads it too.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
